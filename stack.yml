version: "3.8"

services:
  landing:
    image: skyment-landing:latest
    networks:
      - Alejandronet
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      labels:
        traefik.enable: "true"
        traefik.http.routers.skyment_landing.rule: Host(`alejandroohernandez.com`) || Host(`www.alejandroohernandez.com`)
        traefik.http.routers.skyment_landing.entrypoints: websecure
        traefik.http.routers.skyment_landing.tls.certresolver: letsencryptresolver
        traefik.http.routers.skyment_landing.priority: "10"
        traefik.http.routers.skyment_landing.service: skyment_landing
        traefik.http.services.skyment_landing.loadbalancer.server.port: "3000"
        traefik.http.services.skyment_landing.loadbalancer.passHostHeader: "1"

networks:
  Alejandronet:
    external: true
